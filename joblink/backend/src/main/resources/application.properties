spring.application.name=joblink

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/joblink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Dang nhap Google: Client ID (Web application) tao trong Google Cloud Console.
# Dat bien moi truong GOOGLE_CLIENT_ID (cung gia tri VITE_GOOGLE_CLIENT_ID o frontend).
app.google.client-id=${GOOGLE_CLIENT_ID:}

