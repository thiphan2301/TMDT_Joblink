
# ==============================
# APPLICATION
# ==============================
spring.application.name=joblink
server.port=8080

# ==============================
# MYSQL DATABASE
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/joblink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ==============================
# FLYWAY MIGRATION
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================
# JWT AUTHENTICATION
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ==============================
# GMAIL SMTP
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeout
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# EMAIL OTP
# ==============================
app.otp.expiration-minutes=5
