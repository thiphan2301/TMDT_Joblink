# JobLink - Spring Boot 4 / MySQL-compatible MariaDB
spring.application.name=joblink
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/joblink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Email OTP / JWT (SMTP App Password belongs in environment, never commit credentials)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
app.otp.expiration-minutes=5
app.sentiment.base-url=${SENTIMENT_SERVICE_URL:http://localhost:8001}

app.assistant.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.assistant.ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
app.assistant.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.assistant.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
app.assistant.index.fixed-delay-ms=${ASSISTANT_INDEX_DELAY_MS:3600000}
app.assistant.index.initial-delay-ms=${ASSISTANT_INDEX_INITIAL_DELAY_MS:20000}
logging.level.group7.joblink.service.OllamaAssistantClient=INFO

# Optional Google one-tap login. Must match VITE_GOOGLE_CLIENT_ID on frontend.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Optional Facebook login. App ID must match VITE_FACEBOOK_APP_ID on frontend;
# App Secret only in environment, never commit it.
app.facebook.app-id=${FACEBOOK_APP_ID:}
app.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# VNPay payment configuration. Keep the hash secret in the environment only.
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/vi-token}
app.vnpay.employer-return-url=${VNPAY_EMPLOYER_RETURN_URL:http://localhost:5173/employer/plan?paymentFor=employer}

# Gioi h?n upload CV
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# luu file ngoai thu muc source code
app.storage.cv-dir=${user.home}/joblink-data/cvs
# vd tren windowss? duoc luu o:  C:\Users\TEN_USER_WINDOWS\joblink-data\cvs
# Session cookie (development; production HTTPS must use secure=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
