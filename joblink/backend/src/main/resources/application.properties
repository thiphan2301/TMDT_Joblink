# JobLink - Spring Boot 4 / MySQL-compatible MariaDB
spring.application.name=joblink
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/joblink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Email OTP / JWT (SMTP App Password belongs in environment, never commit credentials)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
app.otp.expiration-minutes=5

# Optional Google one-tap login. Must match VITE_GOOGLE_CLIENT_ID on frontend.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Gioi h?n upload CV
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# luu file ngoai thu muc source code
app.storage.cv-dir=${user.home}/joblink-data/cvs
# vd tren windowss? duoc luu o:  C:\Users\TEN_USER_WINDOWS\joblink-data\cvs
# Session cookie (development; production HTTPS must use secure=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
