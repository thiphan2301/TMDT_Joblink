spring.application.name=joblink

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/joblink?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${root}
spring.datasource.password=${}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_RANDOM_SECRET_KEY_AT_LEAST_32_BYTES}
app.jwt.expiration-ms=86400000